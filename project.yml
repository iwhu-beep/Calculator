name: Calculator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Calculator:
    type: application
    platform: iOS
    sources:
      - Calculator
    settings:
      base:
        INFOPLIST_FILE: Calculator/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.calculator
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Calculator/Info.plist
      properties:
        CFBundleName: Calculator
        CFBundleDisplayName: "\u8ba1\u7b97\u5668"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
schemes:
  Calculator:
    build:
      targets:
        Calculator: all
