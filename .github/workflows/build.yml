name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pip3 install Pillow

      - name: Generate App Icons
        run: python3 scripts/gen_icons.py Calculator/Assets.xcassets/AppIcon.appiconset

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath Calculator.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R Calculator.xcarchive/Products/Applications/Calculator.app Payload/
          zip -r Calculator.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Calculator.ipa
          path: Calculator.ipa
          retention-days: 30
