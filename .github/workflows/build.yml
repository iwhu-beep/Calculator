name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml
          echo "=== Schemes ==="
          xcodebuild -project Calculator.xcodeproj -list

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath Calculator.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO 2>&1

      - name: Package IPA from Archive
        if: success()
        run: |
          APP_PATH="Calculator.xcarchive/Products/Applications/Calculator.app"
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH" || echo "App not found, listing archive..."
          ls -R Calculator.xcarchive/Products/ || true
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ 2>/dev/null || cp -R $(find Calculator.xcarchive -name "*.app" -type d | head -1) Payload/
          zip -r Calculator.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator.ipa
          path: Calculator.ipa
          retention-days: 30

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /Users/runner/Library/Developer/Xcode/DerivedData/*/Logs/Build/*.xcactivitylog
